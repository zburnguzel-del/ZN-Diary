.book.hard{border-left:14px solid rgba(0,0,0,.25)}

.fl{animation:fl .5s ease both}.fr{animation:fr .5s ease both}

.dsel .dn{font-weight:bold;color:var(--acc);min-width:60px}

.del{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px}

.empty{text-align:center;color:var(--mut);padding:40px 10px}

.mc div{padding:12px 14px}
.chip{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px}

.bd{background:#e63946;color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px}
summary{cursor:pointer;padding:8px 0;font-weight:bold}
.st2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}

function appear(){const c=COV[S.cover],G=['color','hero','animal','nature'];
  return `
  <h3>${L('cov')}</h3><div class="sw">${COV.map((c,i)=>`<button class="${i==S.cover?'sel':''}" data-cv="${i}" style="background:${c.b}" title="${c.n}">${c.e}</button>`).join('')}</div>
  <h3>${L('bk')}</h3>${seg([['hard',L('hard')],['spiral',L('spiral')],['leather',L('leather')]],S.book,'bk')}
  <h3>${L('md')}</h3>${seg([['flip',L('flip')],['scroll',L('scroll')]],S.mode,'md')}
  <h3>${L('th')}</h3><div class="sw"><button class="${S.th<0?'sel':''}" data-th="-1" style="background:var(--card);font-size:11px">${L('auto')}</button></div>
  ${G.map(g=>`<div class="gl">${L('g_'+g)}</div><div class="sw">${THM.map((t,i)=>t[0]==g?`<button class="${S.th==i?'sel':''}" data-th="${i}" style="background:${t[2]}">${t[1]}</button>`:'').join('')}</div>`).join('')}
  <h3>${L('lv')}</h3>${seg([['none',L('none')]].concat(Object.keys(LV).map(k=>[k,L('l_'+k)])),S.live,'lv')}
`}

function mom(){
  return `<button class="pri" style="margin:0 0 16px" data-sheet>${L('rec')}</button>`+(S.moments.length?S.moments.map(m=>{const d=new Date(m.dt+'T00:00'),c=typeof m.c=='number'?CT[S.lang][m.c]:m.c;
  return `<div class="mc">${m.img?`<img src="${m.img}" alt="">`:''}<div><span class="chip">${esc(c)}</span> <small>${DAY[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}</small><h4 style="margin:6px 0 2px">${esc(m.t||L('nt'))}</h4><p style="margin:0;white-space:pre-wrap">${esc(m.ds)}</p><button class="del" data-dm="${m.id}">${L('dm')}</button></div></div>`}).join(''):`<div class="empty">${L('me')}</div>`)}
function sheet(){const n=new Date(),iso=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');P='';
  $('#sbody').innerHTML=`<h3 style="margin-top:0">${L('sh')}</h3><label>${L('pic')}</label><input type="file" accept="image/*" id="mf"><img id="ph" alt="">
  <label>${L('cat')}</label><select id="mc">${CT[S.lang].map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select>
  <label>${L('ti')}</label><input type="text" id="mt" placeholder="${L('tip')}">
  <label>${L('dt')}</label><input type="date" id="md" value="${iso}">
  <label>${L('ds')}</label><textarea id="ms"></textarea>
  <button class="pri" data-savem>${L('sv')}</button><button class="del" style="width:100%;margin-top:8px" data-close>${L('cn')}</button>`;
  $('#sheet').classList.add('on')}
function rs(f,m=720){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(f)})}

document.addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);let x;
  if(q('.logo')){burst(q('.logo'));return}
  if(x=q('nav button')){v=x.dataset.v;chatWith=null;render();window.scrollTo(0,0);return}
  if(x=q('[data-lg]')){S.lang=x.dataset.lg;setLang()}
  else if(x=q('[data-ft]')){S.font=x.dataset.ft;applyFont()}
  else if(x=q('[data-cv]')){S.cover=+x.dataset.cv}
  else if(x=q('[data-bk]')){S.book=x.dataset.bk}
  else if(x=q('[data-md]')){S.mode=x.dataset.md}
  else if(x=q('[data-th]')){S.th=+x.dataset.th;applyTh()}
  else if(x=q('[data-lv]')){S.live=x.dataset.lv;live()}
  else if(x=q('[data-sd]')){sub.diary=x.dataset.sd}
  else if(x=q('[data-sc]')){sub.chat=x.dataset.sc;chatWith=null}
  else if(x=q('[data-fc]')){fcat=+x.dataset.fc;S.page=0}
  else if(q('[data-new]')){v='diary';sub.diary='d';fcat=-1;addEntry()}
  else if(q('[data-add]')){addEntry()}
  else if(q('[data-addd]')){fcat=-1;addEntry(new Date(cal.y,cal.m,cal.sel));v='diary';sub.diary='d'}
  else if(x=q('[data-del]')){if(!confirm(L('delq')))return;S.entries=S.entries.filter(a=>a.id!=x.dataset.del);dir='fr'}
  else if(q('[data-pv]')){S.page--;dir='fr'}
  else if(q('[data-nx]')){S.page++;dir='fl'}
  else if(x=q('[data-cm]')){cal.m+=+x.dataset.cm;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}cal.sel=Math.min(cal.sel,dim(cal.y,cal.m))}
  else if(x=q('[data-cd]')){cal.sel=+x.dataset.cd}
  else if(x=q('[data-av]')){S.me.a=x.dataset.av;syncMe()}
  else if(q('[data-saveme]')){const u=($('#un').value||'').trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(u)){toast(L('bad'));return}
    if(Object.entries(PR).some(([id,p])=>id!=ME&&p.username==u)){toast(L('taken'));return}
    S.me.u=u;draftU=null;syncMe();toast(L('saved2'))}
  else if(q('[data-login]')){ZNFB.login().catch(e=>toast(e.code||'error'));return}
  else if(q('[data-logout]')){ZNFB.logout();return}
  else if(q('[data-goset]')){v='set'}
  else if(x=q('[data-rmf]')){S.friends=S.friends.filter(f=>f!=x.dataset.rmf);subAll()}
  else if(x=q('[data-addf]')){S.friends.push(x.dataset.addf);subAll();toast(L('added'))}
  else if(x=q('[data-open]')){chatWith=x.dataset.open;stk=false;save();render();window.scrollTo(0,document.body.scrollHeight);return}
  else if(q('[data-back]')){chatWith=null}
  else if(q('[data-stk]')){stk=!stk}
  else if(x=q('[data-ss]')){send({st:x.dataset.ss});stk=false}
  else if(q('[data-send]')){const i=$('#ct');if(i&&i.value.trim()){send({text:i.value.trim()});i.value=''}return}
  else if(q('[data-sheet]')){sheet();return}
  else if(q('[data-close]')||t.id=='sheet'){$('#sheet').classList.remove('on');return}
  else if(q('[data-savem]')){
    if(!P&&!$('#mt').value.trim()&&!$('#ms').value.trim()){toast(L('need'));return}
    S.moments.unshift({id:Date.now(),img:P,c:+$('#mc').value,t:$('#mt').value,dt:$('#md').value,ds:$('#ms').value});
    $('#sheet').classList.remove('on');toast(L('saved'))}
  else if(x=q('[data-dm]')){if(!confirm(L('dmq')))return;S.moments=S.moments.filter(a=>a.id!=x.dataset.dm)}
  else return;
  save();render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ct'){e.preventDefault();const i=e.target;if(i.value.trim()){send({text:i.value.trim()});i.value=''}}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id=='mf'&&t.files[0]){rs(t.files[0]).then(d=>{P=d;const p=$('#ph');p.src=d;p.style.display='block'});return}
  if(t.id=='af'&&t.files[0]){rs(t.files[0],96).then(d=>{S.me.a=d;save();syncMe();render()});return}
  if(t.id=='cf'&&t.files[0]){rs(t.files[0],400).then(d=>send({img:d}));t.value='';return}
  if(t.id=='fs'){paintFR(t.value);return}
  const f=t.dataset.f,pe=t.closest('.page');if(!f||!pe)return;
  const en=S.entries.find(a=>a.id==pe.dataset.id);if(!en)return;
  en[f]=f=='t'?t.value:+t.value;save();
  if(f=='d'||f=='m'||f=='y'){const mx=dim(en.y,en.m);pe.querySelector('.dn').textContent=DAY[new Date(en.y,en.m,Math.min(en.d,mx)).getDay()]}});

setLang();applyTh();applyFont();live();
setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),800)},3000);
