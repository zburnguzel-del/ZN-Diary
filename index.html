<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZN Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Poppins:wght@400;600&family=Quicksand:wght@400;700&family=Comfortaa:wght@400;700&family=Playfair+Display:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Pacifico&display=swap">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4a2a6a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ZN Diary">
<style>
:root{--bg:#faf6f1;--ink:#2d2430;--card:#fff;--mut:#8a7f8c;--acc:#a8477f;--line:#eadfe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121a;--ink:#f1e9f3;--card:#241c29;--mut:#a597a9;--acc:#e07ab8;--line:#3a2e40}}
:root[data-theme="dark"]{--bg:#17121a;--ink:#f1e9f3;--card:#241c29;--mut:#a597a9;--acc:#e07ab8;--line:#3a2e40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh;transition:background .4s}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h3{margin:22px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.gl{font-size:12px;color:var(--mut);margin:10px 0 4px}
.tb{text-align:center;letter-spacing:.5em;opacity:.85;margin-bottom:6px}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#4a2a6a,#150d22);color:#fff;transition:opacity .7s,transform .7s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .logo{width:150px;animation:pop 1.2s cubic-bezier(.2,1.4,.4,1) both}
#splash h1{margin:14px 0 0;font-size:34px;letter-spacing:.14em;animation:rise 1s .8s both}
#splash p{margin:4px 0 0;opacity:.7;font-style:italic;animation:rise 1s 1.2s both}
@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.logo{position:relative;display:block;cursor:pointer}
.logo svg{width:100%;height:auto;overflow:visible}
.ring{transform-origin:50px 50px;animation:spin 8s linear infinite}
.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw:nth-child(2){animation-delay:.5s}.tw:nth-child(3){animation-delay:1s}.tw:nth-child(4){animation-delay:1.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
.sp{position:absolute;left:50%;top:50%;pointer-events:none;color:#ffd96b;animation:fly1 .9s ease-out forwards}
@keyframes fly1{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.book{position:relative;height:340px;max-width:260px;margin:8px auto;border-radius:6px 16px 16px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:6px 8px 22px rgba(0,0,0,.35);overflow:hidden}
.book .logo{width:96px}
.book h2{margin:10px 0 2px;letter-spacing:.12em}
.book p{margin:0;font-size:13px;opacity:.85}
.book .em{position:absolute;right:10px;bottom:6px;font-size:64px;opacity:.4;line-height:1}
.book.hard{border-left:14px solid rgba(0,0,0,.25)}
.book.spiral{border-radius:8px 14px 14px 8px;padding-left:22px}
.book.spiral:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:14px;background:radial-gradient(circle,#ddd 4px,#555 5px,transparent 6px) 0 0/14px 26px repeat-y}
.book.leather{border:3px solid rgba(255,255,255,.35);outline:2px dashed rgba(255,255,255,.5);outline-offset:-14px}
.book.leather:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px);pointer-events:none}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;padding:0}
.sw button.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg) inset}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 28%;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.seg button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.pri{display:block;width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;cursor:pointer}
.page{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 16px 12px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.08);transform-origin:left center}
.page.spiral{padding-left:34px}
.page.spiral:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:14px;background:radial-gradient(circle,var(--bg) 4px,var(--mut) 5px,transparent 6px) 0 0/14px 28px repeat-y}
.page.leather{border:2px solid var(--acc);outline:1px dashed var(--mut);outline-offset:-7px}
.page.hard{border-left:8px solid var(--acc)}
.fl{animation:fl .5s ease both}.fr{animation:fr .5s ease both}
@keyframes fl{from{transform:perspective(900px) rotateY(80deg);opacity:.2}}
@keyframes fr{from{transform:perspective(900px) rotateY(-80deg);opacity:.2}}
.dsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dsel .dn{font-weight:bold;color:var(--acc);min-width:60px}
select,input[type=text],input[type=date],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input.y{width:74px}
textarea{width:100%;min-height:220px;border:0;resize:vertical;background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);line-height:28px;padding:0;outline:0}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl button,.add{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}
.add{width:100%;margin-top:6px;border-style:dashed}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.mc img{width:100%;max-height:300px;object-fit:cover;display:block}
.mc div{padding:12px 14px}
.chip{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px}
.mc small{color:var(--mut)}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#sheet label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
#sheet input,#sheet select,#sheet textarea{width:100%}
#sheet textarea{min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;line-height:1.4}
#ph{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 4px;cursor:pointer;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:bold}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.on{opacity:1}
#live{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.f{position:absolute;opacity:.85;line-height:1}
@keyframes fall{from{transform:translate(0,-12vh) rotate(0)}to{transform:translate(var(--dx),112vh) rotate(360deg)}}
@keyframes rise{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),-115vh) rotate(200deg)}}
@keyframes fly{to{transform:translate(125vw,var(--dy))}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),var(--dy)) rotate(25deg)}}
@keyframes snit{0%{transform:translate(-12vw,0)}18%{transform:translate(28vw,35vh)}36%{transform:translate(62vw,-15vh)}54%{transform:translate(35vw,45vh)}74%{transform:translate(85vw,10vh)}100%{transform:translate(115vw,30vh)}}
.w1{transform-origin:17px 12px;animation:w1 .12s infinite alternate}.w2{transform-origin:29px 12px;animation:w2 .12s infinite alternate}
@keyframes w1{from{transform:rotate(-30deg)}to{transform:rotate(15deg)}}
@keyframes w2{from{transform:rotate(30deg)}to{transform:rotate(-15deg)}}

.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--line);overflow:hidden;flex:none;width:var(--s);height:var(--s);font-size:calc(var(--s)*.6);line-height:1}
.av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.row small{color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer}
.chips .sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:12px;color:var(--mut)}
.cal button{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;position:relative;padding:0}
.cal .td{border-color:var(--acc);font-weight:bold}
.cal .sel{background:var(--acc);color:#fff}
.cal .dot:after{content:"";position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc)}
.cal .sel.dot:after{background:#fff}
.chat{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-color:var(--acc)}
.m img{max-width:100%;border-radius:10px;display:block}
.m .st{font-size:56px;line-height:1.1}
.m small{display:block;font-size:11px;opacity:.75;text-align:right}
.dsep{text-align:center;font-size:12px;color:var(--mut);margin:6px 0}
.cbar{position:sticky;bottom:56px;background:var(--bg);padding:8px 0;display:flex;gap:6px;align-items:center}
.cbar input[type=text]{flex:1;min-width:0}
.cbar .add{padding:8px 12px}
.stk{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);padding:8px;border-radius:12px;margin-bottom:8px}
.stk button{font-size:30px;background:none;border:0;cursor:pointer}
.bd{background:#e63946;color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px}
summary{cursor:pointer;padding:8px 0;font-weight:bold}
.st2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.st2 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px}
.st2 b{display:block;font-size:24px;color:var(--acc)}
.book.sm{height:120px;width:86px;margin:0;flex:none;border-radius:4px 8px 8px 4px;box-shadow:3px 4px 10px rgba(0,0,0,.3)}
.book.sm .logo{width:40px}.book.sm h2{font-size:11px;margin:2px 0 0}.book.sm.spiral:before{display:none}.book.sm.spiral{padding-left:0}

.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin-bottom:10px}
.seg button{flex:none;padding:10px 4px;text-align:center}
nav{display:grid;grid-template-columns:repeat(6,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;font-size:11px;line-height:1.2;position:relative}
nav .ic{font-size:20px;line-height:1}
nav .bd{position:absolute;top:3px;left:calc(50% + 6px);padding:0 5px}
.cbar{bottom:60px}
details summary{list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"▸";color:var(--mut);transition:transform .2s}
details[open]>summary:after{transform:rotate(90deg)}
details>*:not(summary){margin-bottom:10px}
.shelf{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.mb{flex:none;width:74px;height:100px;border-radius:4px 10px 10px 4px;border:0;border-left:7px solid rgba(0,0,0,.3);box-shadow:2px 3px 8px rgba(0,0,0,.25);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;padding:4px;background:var(--card);color:var(--ink)}
.mb .mi{font-size:26px}
.mb.sel{outline:3px solid var(--acc);outline-offset:2px}
.tbr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tbr button{min-width:36px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;cursor:pointer}
.ed{min-height:220px;outline:0;line-height:var(--lh,28px);background:repeating-linear-gradient(transparent 0 calc(var(--lh,28px) - 1px),var(--line) calc(var(--lh,28px) - 1px) var(--lh,28px));word-wrap:break-word}
.ed:empty:before{content:attr(data-ph);color:var(--mut)}
.ed ul,.ed ol{margin:0;padding-left:22px}
.ed h3{margin:0;font-size:1.25em;text-transform:none;letter-spacing:0;color:var(--ink)}
.ss{color:var(--mut);font-size:12px}
.pf{text-align:center;padding:10px 0 14px}.pf h2{margin:8px 0 0}.pf small{color:var(--mut)}

:root{--bgg:linear-gradient(160deg,#faf6f1,#f3e4ef);--acc2:#6d4fd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bgg:linear-gradient(160deg,#17121a,#2a1840);--acc2:#9b6dff}}
:root[data-theme="dark"]{--bgg:linear-gradient(160deg,#17121a,#2a1840);--acc2:#9b6dff}
body{background:var(--bgg);background-attachment:fixed}
#app{padding:0 16px 104px}
.hd{position:relative;display:flex;align-items:center;gap:12px;margin:0 -16px 16px;padding:14px 16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:0 0 26px 26px;box-shadow:0 8px 22px rgba(0,0,0,.25);overflow:hidden}
.hd:after{content:attr(data-e);position:absolute;right:64px;bottom:-16px;font-size:68px;opacity:.2;line-height:1;pointer-events:none}
.hd .logo{width:44px;flex:none}
.hd .ht{flex:1;min-width:0}.hd b{font-size:19px;letter-spacing:.1em}.hd small{display:block;opacity:.92;font-size:13px}
.hav{background:none;border:2px solid rgba(255,255,255,.75);border-radius:50%;padding:0;cursor:pointer;line-height:0;flex:none}
h3{display:flex;align-items:center}
h3:before{content:"";width:18px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-right:8px}
.pri,.seg button.sel,.chip,.chips .sel,.cal .sel,.m.me{background:linear-gradient(135deg,var(--acc),var(--acc2))!important;color:#fff}
.pri{box-shadow:0 8px 18px rgba(0,0,0,.22);border-radius:16px}
.row,.page,.mc,.st2 div,details,.stk{border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.st2 b{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
details{border-left:4px solid var(--acc)}
.cal button{border:0;box-shadow:0 2px 6px rgba(0,0,0,.07);border-radius:12px}
.cal .td{box-shadow:0 0 0 2px var(--acc)}
nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.28);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);padding-bottom:0;overflow:hidden}
nav .ic{display:inline-block;padding:3px 12px;border-radius:14px;transition:.2s}
nav button.on .ic{background:linear-gradient(135deg,var(--acc),var(--acc2));filter:saturate(1.1)}
.cbar{bottom:80px}#toast{bottom:100px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fg button{padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;font-size:16px}
.fg button.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.bl{display:flex;align-items:center;justify-content:center;padding:10px 4px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;text-align:center}
#lock{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#4a2a6a,#150d22);color:#fff}
#lock.on{display:flex}.lk{text-align:center;width:260px}.lk .logo{width:80px;margin:0 auto}
.dots{display:flex;gap:14px;justify-content:center;margin:14px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#ffd96b;border-color:#ffd96b}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kp button{height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px}

.stamp{font-size:12px;color:var(--mut);margin-top:8px}
.mb{position:relative;overflow:hidden}.mb small{opacity:.85;font-size:10px}.mb.dim{opacity:.55}
.ch{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}.ch .book{height:230px;width:170px;margin:4px auto}
.cvg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
.cvi{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:4px 12px 12px 4px;border:0;border-left:8px solid rgba(0,0,0,.3);box-shadow:2px 4px 10px rgba(0,0,0,.3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center}
.cvi span{font-size:28px}.cvi b{font-size:11px;line-height:1.2}.cvi.sel{outline:3px solid var(--acc);outline-offset:2px}
.book,.mb,.cvi{isolation:isolate}
.book.leather:after{content:none}
.mt-matte:after{content:none}
.mt-grain:after,.mt-croc:after,.mt-quilt:after,.mt-denim:after,.mt-velvet:after,.mt-glitter:after,.mt-wood:after,.mt-linen:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
.mt-grain:after{background:repeating-linear-gradient(45deg,rgba(0,0,0,.09) 0 2px,transparent 2px 5px),radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 55%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.12),inset 0 0 0 5px rgba(0,0,0,.2)}
.mt-croc:after{background:radial-gradient(circle at 50% 100%,transparent 0 52%,rgba(0,0,0,.28) 54% 62%,transparent 64%) 0 0/20px 13px,radial-gradient(circle at 50% 0,rgba(255,255,255,.14),transparent 60%) 10px 6px/20px 13px}
.mt-quilt:after{background:linear-gradient(45deg,rgba(0,0,0,.22) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(-45deg,rgba(0,0,0,.22) 1px,transparent 1px) 0 0/24px 24px,radial-gradient(circle,rgba(255,255,255,.35) 0 2px,transparent 3px) 0 0/24px 24px}
.mt-denim:after{background:repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
